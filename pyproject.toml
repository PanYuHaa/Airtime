[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airtime"
version = "1.0.0"
description = "Airtime — Freestyle ski motion analysis from a single video"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PanYuHaa" }]
keywords = [
    "pose-estimation", "3d-reconstruction", "ski", "freestyle-ski",
    "sports-analysis", "computer-vision",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "onnxruntime-gpu>=1.17",
    "rtmlib>=0.0.10",
]

[project.optional-dependencies]
# 三维重建需要（按官方说明安装 CUDA 版 torch）
gemx = ["torch>=2.0", "torchvision"]
dev = ["pytest>=7", "ruff"]

[project.scripts]
airtime = "airtime.run:main"
airtime-check = "airtime.cfg:main"
airtime-eval = "airtime.eval:main"

[project.urls]
Homepage = "https://github.com/PanYuHaa/Airtime"
Issues = "https://github.com/PanYuHaa/Airtime/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
